<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員番号検索システム</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 900px; 
      margin: 40px auto; 
      padding: 0 20px; 
      line-height: 1.6; 
      color: #333; 
      font-size: 19px; 
    }
    
    h2 { 
      font-size: 29px; 
      border-bottom: 2px solid #0070f3; 
      padding-bottom: 8px; 
      margin-bottom: 20px; 
    }
    
    .usage-guide {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-left: 5px solid #0070f3;
      border-radius: 6px;
      padding: 18px 24px;
      margin-bottom: 24px;
      font-size: 17px; 
    }
    .usage-guide p { margin: 0 0 8px 0; }
    .usage-guide ul { margin: 0 0 14px 0; padding-left: 24px; }
    .usage-guide ul li { margin-bottom: 6px; }
    .guide-title { font-weight: bold; color: #0070f3; margin-bottom: 8px; font-size: 19px; }

    .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
    input[type="text"] { 
      flex: 1; 
      padding: 14px; 
      font-size: 19px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      outline: none; 
    }
    input[type="text"]:focus { border-color: #0070f3; }
    
    .btn-search { 
      padding: 14px 28px; 
      font-size: 19px; 
      background-color: #0070f3; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: background-color 0.2s; 
      white-space: nowrap; 
    }
    .btn-search:hover { background-color: #0051a2; }

    /* 登録完了ボタンのスタイル */
    .btn-complete {
      padding: 8px 16px;
      font-size: 16px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-complete:hover { background-color: #059669; }
    .btn-complete:disabled { background-color: #a7f3d0; cursor: not-allowed; }

    /* 登録済ラベルのスタイル */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 16px;
      font-weight: bold;
      color: #065f46;
      background-color: #d1fae5;
      border-radius: 4px;
    }
    
    #status { margin-bottom: 12px; font-weight: bold; font-size: 19px; }
    .loading { color: #666; font-style: italic; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 18px; }
    th, td { border: 1px solid #e0e0e0; padding: 14px; text-align: left; vertical-align: middle; }
    th { background-color: #f7f9fa; font-weight: 600; }
    tr:nth-child(even) { background-color: #fcfcfc; }
  </style>
</head>
<body>

  <h2>🔍 会員番号検索システム</h2>

  <div class="usage-guide">
    <div class="guide-title">【使い方・検索のコツ】</div>
    <ul>
      <li>「氏名」または「企業名」の一部から検索できます。</li>
      <li>複数のキーワードを「スペース（空白）」で区切ると、条件を絞り込めます。</li>
    </ul>

    <div class="guide-title">【入力例】</div>
    <ul>
      <li>「佐藤」 → 氏名または企業名に「佐藤」が含まれるデータ</li>
      <li>「グローバル」 → 氏名または企業名に「グローバル」が含まれるデータ</li>
      <li>「佐藤 グローバル」 → 氏名に「佐藤」があり、かつ企業名に「グローバル」が含まれるデータ</li>
    </ul>
  </div>
  
  <div class="search-box">
    <input type="text" id="keyword" placeholder="氏名や企業名を入力..." onkeypress="if(event.key==='Enter') search()">
    <button class="btn-search" onclick="search()">検索</button>
  </div>

  <div id="status"></div>

  <table>
    <thead>
      <tr>
        <th>会員番号</th>
        <th>氏名</th>
        <th>企業名</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody id="result-table">
      <!-- 検索結果の表示エリア -->
    </tbody>
  </table>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzUGvGV3VTk27ZvBB9CMJsdasXVtygmlv0IBF63Dlbm7r0h18LNJqYkzqsJtnbizJWI/exec";

    async function search() {
      const keyword = document.getElementById("keyword").value.trim();
      const statusEl = document.getElementById("status");
      const tableBody = document.getElementById("result-table");

      statusEl.className = "loading";
      statusEl.textContent = "検索中...";
      tableBody.innerHTML = "";

      try {
        const response = await fetch(`${GAS_API_URL}?keyword=${encodeURIComponent(keyword)}`, {
          method: "GET",
          redirect: "follow"
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        statusEl.className = "";
        statusEl.textContent = `検索結果: ${data.length} 件`;

        if (data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">該当する会員は見つかりませんでした。</td></tr>';
          return;
        }

        data.forEach(item => {
          const row = document.createElement("tr");
          
          // ステータス表示の切り替え（登録済 / 登録完了ボタン）
          let statusHtml = "";
          if (item.登録ステータス === "登録済") {
            statusHtml = `<span class="status-badge">登録済</span>`;
          } else {
            statusHtml = `<button class="btn-complete" onclick="updateStatus('${item.会員番号}', this)">登録完了</button>`;
          }

          row.innerHTML = `
            <td>${item.会員番号 || ''}</td>
            <td>${item.氏名 || ''}</td>
            <td>${item.企業名 || ''}</td>
            <td>${statusHtml}</td>
          `;
          tableBody.appendChild(row);
        });

      } catch (error) {
        console.error("Error:", error);
        statusEl.className = "";
        statusEl.style.color = "red";
        statusEl.textContent = "データの取得に失敗しました。";
      }
    }

    // 登録完了ボタンが押された時の更新処理
    async function updateStatus(memberNo, btnElement) {
      if (!confirm(`会員番号: ${memberNo} を「登録済」に変更しますか？`)) {
        return;
      }

      btnElement.disabled = true;
      btnElement.textContent = "更新中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ memberNo: memberNo }),
          redirect: "follow"
        });

        const resData = await response.json();

        if (resData.success) {
          // ボタンの親要素（td列）を取得し、ボタンを消去して「登録済」バッジに変更
          const tdCell = btnElement.parentElement;
          tdCell.innerHTML = `<span class="status-badge">登録済</span>`;
        } else {
          alert("更新に失敗しました。もう一度お試しください。");
          btnElement.disabled = false;
          btnElement.textContent = "登録完了";
        }
      } catch (error) {
        console.error("Update Error:", error);
        alert("通信エラーが発生しました。");
        btnElement.disabled = false;
        btnElement.textContent = "登録完了";
      }
    }

    // 初期表示時に全件検索を実行
    window.onload = search;
  </script>
</body>
</html>
