<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政書士試験 択一対策＆クラウド同期ダッシュボード</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --gray-light: #f1f5f9;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --neutral-bg: #e2e8f0;
      --neutral-text: #475569;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .auth-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info {
      font-size: 0.9em;
      font-weight: bold;
      color: #1e40af;
    }
    .tab-header {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--gray-light);
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: none;
      font-size: 1em;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--gray-light);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 4px;
    }
    .stat-label {
      font-size: 0.8em;
      color: #64748b;
    }
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .category-item {
      background: #fff;
      border: 1px solid var(--gray-light);
      border-radius: 8px;
      overflow: hidden;
    }
    .category-header {
      padding: 12px;
      cursor: pointer;
      background: #fff;
      transition: background 0.2s;
    }
    .category-header:hover {
      background: #f8fafc;
    }
    .category-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .progress-bar-bg {
      background: var(--gray-light);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--primary-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    .question-sub-list {
      display: none;
      border-top: 1px solid var(--gray-light);
      background: #fafafa;
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .category-item.open .question-sub-list {
      display: block;
    }
    .q-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      margin-bottom: 4px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88em;
      transition: all 0.2s;
    }
    .q-row:hover {
      border-color: var(--primary-color);
      background: #eff6ff;
    }
    .q-row-info {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow: hidden;
    }
    .q-row-id {
      font-weight: bold;
      color: #64748b;
      min-width: 45px;
    }
    .q-row-thema {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.78em;
      font-weight: bold;
      white-space: nowrap;
    }
    .status-badge.correct {
      background: var(--success-bg);
      color: var(--success-text);
    }
    .status-badge.wrong {
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    .status-badge.unanswered {
      background: var(--neutral-bg);
      color: var(--neutral-text);
    }
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .nav-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #334155;
      font-size: 0.9em;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background: #eff6ff;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .topic-tag {
      display: inline-block;
      background-color: #eff6ff;
      color: var(--primary-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .question {
      font-size: 1.05em;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .option-btn {
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      text-align: left;
      font-size: 100%;
      cursor: pointer;
      line-height: 1.5;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-box.correct {
      background-color: #dcfce7;
      color: #14532d;
      border: 1px solid #bbf7d0;
    }
    .result-box.wrong {
      background-color: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fecaca;
    }
    .explanation {
      margin-top: 12px;
      font-size: 0.95em;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-secondary {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-danger {
      background-color: #94a3b8;
      font-size: 0.8em;
      padding: 6px 12px;
      margin-top: 20px;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="auth-box">
    <div class="user-info" id="user-status">ログインしてGoogleドライブと同期可能</div>
    <button id="auth-btn" class="btn-secondary" onclick="handleAuthClick()">Googleでログイン</button>
  </div>

  <div id="loading">問題データを読み込み中...</div>

  <div id="app-content" style="display: none;">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('dashboard')">ダッシュボード</button>
      <button class="tab-btn" onclick="switchTab('quiz')">問題演習</button>
    </div>

    <!-- ダッシュボード -->
    <div id="tab-dashboard">
      <h2 style="margin-top:0;">学習状況</h2>
      
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-label">総解答数</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">正解数</div>
          <div class="stat-value" id="stat-correct">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">全体正解率</div>
          <div class="stat-value" id="stat-rate">0%</div>
        </div>
      </div>

      <h3>科目別分析 (タップで問題一覧を表示)</h3>
      <div class="category-list" id="category-stats"></div>

      <button class="btn-primary" onclick="switchTab('quiz')">問題を解く</button>
      <center><button class="btn-primary btn-danger" onclick="resetStats()">学習データをリセット</button></center>
    </div>

    <!-- クイズ画面 -->
    <div id="tab-quiz" style="display: none;">
      <div class="nav-header">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">＜ 前の問題</button>
        <span id="q-progress" style="font-weight: bold; color: #64748b; font-size: 0.9em;"></span>
        <button class="nav-btn" id="next-top-btn" onclick="nextQuestion()">次の問題 ＞</button>
      </div>

      <div class="meta">
        <span id="q-category"></span>
      </div>
      <div id="q-thema" class="topic-tag"></div>
      <div class="question" id="q-text"></div>
      <div class="options" id="q-options"></div>
      
      <div id="result-box" class="result-box">
        <h3 id="result-title" style="margin-top:0;"></h3>
        <div>正解：<span id="correct-answer"></span></div>
        <div class="explanation" id="q-explanation"></div>
        <button class="btn-primary" onclick="nextQuestion()">次の問題へ</button>
      </div>
    </div>
  </div>
</div>

<script>
  const CLIENT_ID = '198605799094-9phc85mf7slksn9tpnh4vlfbvhljtm3a.apps.googleusercontent.com';
  const API_URL = "https://script.google.com/macros/s/AKfycby5CbCOq9qtOTdHTo-bL5yXN_GHxJiCFePbk6Uz0It1E1oLTH7EM4WKEZSzqw65XA4/exec";

  let tokenClient;
  let accessToken = null;
  let fileId = null;

  let questions = [];
  let currentIndex = 0;
  
  let userStats = JSON.parse(localStorage.getItem("gyosei_quiz_stats")) || {
    total: 0,
    correct: 0,
    categories: {},
    itemHistory: {}
  };

  function initGoogleAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: async (response) => {
        if (response.error !== undefined) {
          throw (response);
        }
        accessToken = response.access_token;
        
        // トークンと有効期限をlocalStorageに保持 (ログイン状態を維持)
        const expiresAt = Date.now() + (response.expires_in * 1000);
        localStorage.setItem("google_access_token", accessToken);
        localStorage.setItem("google_token_expires_at", expiresAt);

        setLoggedInUI();
        await loadStatsFromDrive();
      },
    });

    // 保存されているトークンが存在し、期限内であれば自動ログイン
    const savedToken = localStorage.getItem("google_access_token");
    const expiresAt = localStorage.getItem("google_token_expires_at");

    if (savedToken && expiresAt && Date.now() < parseInt(expiresAt)) {
      accessToken = savedToken;
      setLoggedInUI();
      loadStatsFromDrive();
    }
  }

  function setLoggedInUI() {
    document.getElementById('user-status').innerText = '☁ Googleドライブ同期中';
    document.getElementById('auth-btn').innerText = 'ログアウト';
    document.getElementById('auth-btn').onclick = handleSignout;
  }

  function handleAuthClick() {
    if (accessToken === null) {
      tokenClient.requestAccessToken({prompt: ''});
    }
  }

  function handleSignout() {
    // ログアウト処理：トークンを削除して初期UIへ
    localStorage.removeItem("google_access_token");
    localStorage.removeItem("google_token_expires_at");

    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => {
        accessToken = null;
        document.getElementById('user-status').innerText = 'ログインしてGoogleドライブと同期可能';
        document.getElementById('auth-btn').innerText = 'Googleでログイン';
        document.getElementById('auth-btn').onclick = handleAuthClick;
      });
    } else {
      document.getElementById('user-status').innerText = 'ログインしてGoogleドライブと同期可能';
      document.getElementById('auth-btn').innerText = 'Googleでログイン';
      document.getElementById('auth-btn').onclick = handleAuthClick;
    }
  }

  async function loadStatsFromDrive() {
    if (!accessToken) return;
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      
      // トークン切れなどで401エラーが出た場合はログアウト扱いにして再取得を促す
      if (res.status === 401) {
        handleSignout();
        return;
      }

      const data = await res.json();
      const file = data.files.find(f => f.name === 'gyosei_stats.json');

      if (file) {
        fileId = file.id;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        userStats = await fileRes.json();
        if(!userStats.itemHistory) userStats.itemHistory = {};
        localStorage.setItem("gyosei_quiz_stats", JSON.stringify(userStats));
        updateDashboard();
      } else {
        await saveStatsToDrive();
      }
    } catch (err) {
      console.error("ドライブからの読み込み失敗:", err);
    }
  }

  async function saveStatsToDrive() {
    localStorage.setItem("gyosei_quiz_stats", JSON.stringify(userStats));
    if (!accessToken) return;

    const fileContent = JSON.stringify(userStats);
    
    try {
      if (fileId) {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: fileContent
        });
      } else {
        const metadata = {
          name: 'gyosei_stats.json',
          parents: ['appDataFolder']
        };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([fileContent], { type: 'application/json' }));

        const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}` },
          body: form
        });
        const data = await res.json();
        fileId = data.id;
      }
    } catch(err) {
      console.error("ドライブへの保存失敗:", err);
    }
  }

  async function init() {
    try {
      const response = await fetch(API_URL);
      questions = await response.json();
      if(!userStats.itemHistory) userStats.itemHistory = {};
      
      document.getElementById("loading").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      
      updateDashboard();
      showQuestion();
      initGoogleAuth();
    } catch (error) {
      document.getElementById("loading").innerText = "データの読み込みに失敗しました。";
    }
  }

  function switchTab(tabName) {
    const isDash = tabName === 'dashboard';
    document.getElementById("tab-dashboard").style.display = isDash ? "block" : "none";
    document.getElementById("tab-quiz").style.display = isDash ? "none" : "block";
    
    const tabs = document.querySelectorAll(".tab-btn");
    tabs[0].classList.toggle("active", isDash);
    tabs[1].classList.toggle("active", !isDash);

    if (isDash) updateDashboard();
  }

  function updateDashboard() {
    document.getElementById("stat-total").innerText = userStats.total;
    document.getElementById("stat-correct").innerText = userStats.correct;
    const rate = userStats.total > 0 ? Math.round((userStats.correct / userStats.total) * 100) : 0;
    document.getElementById("stat-rate").innerText = `${rate}%`;

    const catContainer = document.getElementById("category-stats");
    catContainer.innerHTML = "";

    const categories = [...new Set(questions.map(q => q.category || "その他"))];

    categories.forEach(cat => {
      const catData = userStats.categories[cat] || { total: 0, correct: 0 };
      const catRate = catData.total > 0 ? Math.round((catData.correct / catData.total) * 100) : 0;
      
      const catQuestions = questions.filter(q => (q.category || "その他") === cat);

      const item = document.createElement("div");
      item.className = "category-item";
      
      const header = document.createElement("div");
      header.className = "category-header";
      header.onclick = () => item.classList.toggle("open");
      header.innerHTML = `
        <div class="category-meta">
          <span>${cat} (全${catQuestions.length}問) ▼</span>
          <span>正解率 ${catRate}% (${catData.correct}/${catData.total}問)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${catRate}%;"></div>
        </div>
      `;
      item.appendChild(header);

      const subList = document.createElement("div");
      subList.className = "question-sub-list";

      catQuestions.forEach((q) => {
        const qIndex = questions.indexOf(q);
        const history = userStats.itemHistory ? userStats.itemHistory[q.id] : null;
        
        let statusBadge = `<span class="status-badge unanswered">未解答</span>`;
        if (history) {
          if (history.lastResult === 'correct') {
            statusBadge = `<span class="status-badge correct">正答済み</span>`;
          } else if (history.lastResult === 'wrong') {
            statusBadge = `<span class="status-badge wrong">未正答</span>`;
          }
        }

        const qRow = document.createElement("div");
        qRow.className = "q-row";
        qRow.onclick = () => jumpToQuestion(qIndex);
        qRow.innerHTML = `
          <div class="q-row-info">
            <span class="q-row-id">問${q.id}</span>
            <span class="q-row-thema">${q.thema || q.subcategory || 'テーマなし'}</span>
          </div>
          ${statusBadge}
        `;
        subList.appendChild(qRow);
      });

      item.appendChild(subList);
      catContainer.appendChild(item);
    });
  }

  function jumpToQuestion(index) {
    currentIndex = index;
    showQuestion();
    switchTab('quiz');
  }

  function showQuestion() {
    const q = questions[currentIndex];
    const categoryText = q.subcategory ? `${q.category} > ${q.subcategory}` : (q.category || '');
    const yearText = q.year ? `［${q.year}］` : '';
    document.getElementById("q-category").innerText = `【${categoryText}】 ${yearText}`;
    
    const themaElem = document.getElementById("q-thema");
    if (q.thema) {
      themaElem.style.display = "inline-block";
      themaElem.innerText = `テーマ：${q.thema}`;
    } else {
      themaElem.style.display = "none";
    }

    document.getElementById("q-progress").innerText = `問 ${currentIndex + 1} / ${questions.length}`;
    document.getElementById("prev-btn").disabled = currentIndex === 0;
    document.getElementById("next-top-btn").disabled = currentIndex === questions.length - 1;

    document.getElementById("q-text").innerText = q.question;
    document.getElementById("result-box").style.display = "none";

    const optionsContainer = document.getElementById("q-options");
    optionsContainer.innerHTML = "";

    [1, 2, 3, 4, 5].forEach(num => {
      const optText = q[`option${num}`];
      if (optText) {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `肢${num}. ${optText}`;
        btn.onclick = () => selectOption(num);
        optionsContainer.appendChild(btn);
      }
    });
  }

  async function selectOption(selectedNum) {
    const q = questions[currentIndex];
    const isCorrect = selectedNum == q.answer;
    const category = q.category || "その他";

    userStats.total++;
    if (isCorrect) userStats.correct++;

    if (!userStats.categories[category]) {
      userStats.categories[category] = { total: 0, correct: 0 };
    }
    userStats.categories[category].total++;
    if (isCorrect) userStats.categories[category].correct++;

    if (!userStats.itemHistory) userStats.itemHistory = {};
    userStats.itemHistory[q.id] = {
      lastResult: isCorrect ? 'correct' : 'wrong'
    };

    await saveStatsToDrive();

    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);

    const resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    resultBox.className = isCorrect ? "result-box correct" : "result-box wrong";
    document.getElementById("result-title").innerText = isCorrect ? "⭕ 正解！" : "❌ 不正解...";
    document.getElementById("correct-answer").innerText = `肢 ${q.answer}`;
    document.getElementById("q-explanation").innerText = q.explanation || "解説はありません。";
  }

  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      showQuestion();
    } else {
      alert("最後の問題です。ダッシュボードで結果を確認してみましょう。");
      switchTab('dashboard');
    }
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      showQuestion();
    }
  }

  async function resetStats() {
    if (confirm("これまでの学習データをすべて消去して初期化しますか？")) {
      userStats = { total: 0, correct: 0, categories: {}, itemHistory: {} };
      localStorage.removeItem("gyosei_quiz_stats");
      await saveStatsToDrive();
      updateDashboard();
      alert("学習データをリセットしました。");
    }
  }

  init();
</script>

</body>
</html>
