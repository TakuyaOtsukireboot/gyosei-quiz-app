<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政書士試験 択一対策＆クラウド同期ダッシュボード</title>
  <!-- Google Identity Services (ログイン用) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --gray-light: #f1f5f9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .auth-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info {
      font-size: 0.9em;
      font-weight: bold;
      color: #1e40af;
    }
    .tab-header {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--gray-light);
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: none;
      font-size: 1em;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--gray-light);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 4px;
    }
    .stat-label {
      font-size: 0.8em;
      color: #64748b;
    }
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .category-item {
      background: #fff;
      border: 1px solid var(--gray-light);
      padding: 12px;
      border-radius: 8px;
    }
    .category-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .progress-bar-bg {
      background: var(--gray-light);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--primary-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .topic-tag {
      display: inline-block;
      background-color: #eff6ff;
      color: var(--primary-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .question {
      font-size: 1.05em;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .option-btn {
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      text-align: left;
      font-size: 100%;
      cursor: pointer;
      line-height: 1.5;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-box.correct {
      background-color: #dcfce7;
      color: #14532d;
      border: 1px solid #bbf7d0;
    }
    .result-box.wrong {
      background-color: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fecaca;
    }
    .explanation {
      margin-top: 12px;
      font-size: 0.95em;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-secondary {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Google ログイン状態バー -->
  <div class="auth-box">
    <div class="user-info" id="user-status">ログインしてGoogleドライブと同期可能</div>
    <button id="auth-btn" class="btn-secondary" onclick="handleAuthClick()">Googleでログイン</button>
  </div>

  <div id="loading">問題データを読み込み中...</div>

  <div id="app-content" style="display: none;">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('dashboard')">ダッシュボード</button>
      <button class="tab-btn" onclick="switchTab('quiz')">問題演習</button>
    </div>

    <!-- ダッシュボード -->
    <div id="tab-dashboard">
      <h2 style="margin-top:0;">学習状況</h2>
      
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-label">総解答数</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">正解数</div>
          <div class="stat-value" id="stat-correct">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">全体正解率</div>
          <div class="stat-value" id="stat-rate">0%</div>
        </div>
      </div>

      <h3>科目別分析</h3>
      <div class="category-list" id="category-stats"></div>

      <button class="btn-primary" onclick="switchTab('quiz')">問題を解く</button>
    </div>

    <!-- クイズ画面 -->
    <div id="tab-quiz" style="display: none;">
      <div class="meta">
        <span id="q-category"></span>
        <span id="q-progress"></span>
      </div>
      <div id="q-thema" class="topic-tag"></div>
      <div class="question" id="q-text"></div>
      <div class="options" id="q-options"></div>
      
      <div id="result-box" class="result-box">
        <h3 id="result-title" style="margin-top:0;"></h3>
        <div>正解：<span id="correct-answer"></span></div>
        <div class="explanation" id="q-explanation"></div>
        <button class="btn-primary" onclick="nextQuestion()">次の問題へ</button>
      </div>
    </div>
  </div>
</div>

<script>
  const CLIENT_ID = '198605799094-9phc85mf7slksn9tpnh4vlfbvhljtm3a.apps.googleusercontent.com';
  const API_URL = "https://script.google.com/macros/s/AKfycby5CbCOq9qtOTdHTo-bL5yXN_GHxJiCFePbk6Uz0It1E1oLTH7EM4WKEZSzqw65XA4/exec";

  let tokenClient;
  let accessToken = null;
  let fileId = null;

  let questions = [];
  let currentIndex = 0;
  
  let userStats = JSON.parse(localStorage.getItem("gyosei_quiz_stats")) || {
    total: 0,
    correct: 0,
    categories: {}
  };

  function initGoogleAuth() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.appdata',
      callback: async (response) => {
        if (response.error !== undefined) {
          throw (response);
        }
        accessToken = response.access_token;
        document.getElementById('user-status').innerText = '☁ Googleドライブ同期中';
        document.getElementById('auth-btn').innerText = 'ログアウト';
        document.getElementById('auth-btn').onclick = handleSignout;
        
        await loadStatsFromDrive();
      },
    });
  }

  function handleAuthClick() {
    if (accessToken === null) {
      tokenClient.requestAccessToken({prompt: 'consent'});
    }
  }

  function handleSignout() {
    if (accessToken) {
      google.accounts.oauth2.revoke(accessToken, () => {
        accessToken = null;
        document.getElementById('user-status').innerText = 'ログインしてGoogleドライブと同期可能';
        document.getElementById('auth-btn').innerText = 'Googleでログイン';
        document.getElementById('auth-btn').onclick = handleAuthClick;
      });
    }
  }

  async function loadStatsFromDrive() {
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder', {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      const file = data.files.find(f => f.name === 'gyosei_stats.json');

      if (file) {
        fileId = file.id;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        userStats = await fileRes.json();
        localStorage.setItem("gyosei_quiz_stats", JSON.stringify(userStats));
        updateDashboard();
      } else {
        await saveStatsToDrive();
      }
    } catch (err) {
      console.error("ドライブからの読み込み失敗:", err);
    }
  }

  async function saveStatsToDrive() {
    localStorage.setItem("gyosei_quiz_stats", JSON.stringify(userStats));
    if (!accessToken) return;

    const fileContent = JSON.stringify(userStats);
    
    if (fileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: fileContent
      });
    } else {
      const metadata = {
        name: 'gyosei_stats.json',
        parents: ['appDataFolder']
      };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([fileContent], { type: 'application/json' }));

      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}` },
        body: form
      });
      const data = await res.json();
      fileId = data.id;
    }
  }

  async function init() {
    try {
      const response = await fetch(API_URL);
      questions = await response.json();
      document.getElementById("loading").style.display = "none";
      document.getElementById("app-content").style.display = "block";
      
      updateDashboard();
      showQuestion();
      initGoogleAuth();
    } catch (error) {
      document.getElementById("loading").innerText = "データの読み込みに失敗しました。";
    }
  }

  function switchTab(tabName) {
    const isDash = tabName === 'dashboard';
    document.getElementById("tab-dashboard").style.display = isDash ? "block" : "none";
    document.getElementById("tab-quiz").style.display = isDash ? "none" : "block";
    
    const tabs = document.querySelectorAll(".tab-btn");
    tabs[0].classList.toggle("active", isDash);
    tabs[1].classList.toggle("active", !isDash);

    if (isDash) updateDashboard();
  }

  function updateDashboard() {
    document.getElementById("stat-total").innerText = userStats.total;
    document.getElementById("stat-correct").innerText = userStats.correct;
    const rate = userStats.total > 0 ? Math.round((userStats.correct / userStats.total) * 100) : 0;
    document.getElementById("stat-rate").innerText = `${rate}%`;

    const catContainer = document.getElementById("category-stats");
    catContainer.innerHTML = "";

    const categories = [...new Set(questions.map(q => q.category || "その他"))];

    categories.forEach(cat => {
      const catData = userStats.categories[cat] || { total: 0, correct: 0 };
      const catRate = catData.total > 0 ? Math.round((catData.correct / catData.total) * 100) : 0;

      const item = document.createElement("div");
      item.className = "category-item";
      item.innerHTML = `
        <div class="category-meta">
          <span>${cat}</span>
          <span>正解率 ${catRate}% (${catData.correct}/${catData.total}問)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: ${catRate}%;"></div>
        </div>
      `;
      catContainer.appendChild(item);
    });
  }

  function showQuestion() {
    const q = questions[currentIndex];
    const categoryText = q.subcategory ? `${q.category} > ${q.subcategory}` : (q.category || '');
    const yearText = q.year ? `［${q.year}］` : '';
    document.getElementById("q-category").innerText = `【${categoryText}】 ${yearText}`;
    
    const themaElem = document.getElementById("q-thema");
    if (q.thema) {
      themaElem.style.display = "inline-block";
      themaElem.innerText = `テーマ：${q.thema}`;
    } else {
      themaElem.style.display = "none";
    }

    document.getElementById("q-progress").innerText = `問 ${currentIndex + 1} / ${questions.length}`;
    document.getElementById("q-text").innerText = q.question;
    document.getElementById("result-box").style.display = "none";

    const optionsContainer = document.getElementById("q-options");
    optionsContainer.innerHTML = "";

    [1, 2, 3, 4, 5].forEach(num => {
      const optText = q[`option${num}`];
      if (optText) {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `肢${num}. ${optText}`;
        btn.onclick = () => selectOption(num);
        optionsContainer.appendChild(btn);
      }
    });
  }

  async function selectOption(selectedNum) {
    const q = questions[currentIndex];
    const isCorrect = selectedNum == q.answer;
    const category = q.category || "その他";

    userStats.total++;
    if (isCorrect) userStats.correct++;

    if (!userStats.categories[category]) {
      userStats.categories[category] = { total: 0, correct: 0 };
    }
    userStats.categories[category].total++;
    if (isCorrect) userStats.categories[category].correct++;

    await saveStatsToDrive();

    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);

    const resultBox = document.getElementById("result-box");
    resultBox.style.display = "block";
    resultBox.className = isCorrect ? "result-box correct" : "result-box wrong";
    document.getElementById("result-title").innerText = isCorrect ? "⭕ 正解！" : "❌ 不正解...";
    document.getElementById("correct-answer").innerText = `肢 ${q.answer}`;
    document.getElementById("q-explanation").innerText = q.explanation || "解説はありません。";
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      showQuestion();
    } else {
      alert("すべての問題をとき終えました！ダッシュボードで結果を確認してみましょう。");
      currentIndex = 0;
      switchTab('dashboard');
    }
  }

  init();
</script>

</body>
</html>
